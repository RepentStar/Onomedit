name: Test absolute path renames

on:
  pull_request:
    paths:
      - 'src/onomedit/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test-absolute-path.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  absolute-path:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . pytest
      - run: python -m pytest tests/test_absolute_rename.py
