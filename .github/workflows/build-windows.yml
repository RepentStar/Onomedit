name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build full Rust release
        run: cargo build --locked --release --bin onomedit

      - name: Build CLI-only Rust release
        run: cargo build --locked --release --no-default-features --bin onomedit-cli

      - name: Stage release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/onomedit.exe dist/onomedit.exe
          Copy-Item target/release/onomedit-cli.exe dist/onomedit-cli.exe

      - name: Test packaged executables
        shell: pwsh
        run: pwsh -NoProfile -File scripts/e2e_release.ps1 -FullExecutable dist/onomedit.exe -CliExecutable dist/onomedit-cli.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: onomedit-windows
          path: |
            dist/onomedit.exe
            dist/onomedit-cli.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/onomedit.exe
            dist/onomedit-cli.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
